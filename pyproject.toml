[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-team"
version = "0.1.0"
description = "Type-safe team orchestration for pydantic-ai Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Fabio Pulvirenti", email = "fabio@etiqa.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
]
dependencies = [
    "pydantic>=2",
    "pydantic-ai>=1.0",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/etiqa/pydantic-team"
Source = "https://github.com/etiqa/pydantic-team"

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]
lint = [
    "pre-commit>=4.0",
    "pyright>=1.1",
    "ruff>=0.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.hatch.build.targets.wheel]
packages = ["pydantic_team"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = [
    "pydantic_team/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100",
    "D102",
    "D104",
    "D105",
    "D107",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pydantic_team"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["pydantic_team", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pydantic_team"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
